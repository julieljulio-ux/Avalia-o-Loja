<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Império BR</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .logo-loja { width: 150px; height: auto; margin-bottom: 10px; }
        
        h1 { color: #333; margin-bottom: 5px; font-size: 26px; }
        p { color: #666; margin-bottom: 25px; }
        
        .team-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        
        .staff-card { cursor: pointer; padding: 10px; border-radius: 12px; transition: 0.3s; background: #fff; border: 1px solid #eee; }
        .staff-card:hover { border-color: #ff69b4; background: #fff0f5; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .staff-card.selected { border-color: #ff69b4; background: #fff0f5; }
        
        .staff-card img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; pointer-events: none; }
        .staff-card p { margin: 10px 0 0; font-weight: bold; font-size: 14px; color: #444; }

        .form-section { margin-top: 30px; display: none; border-top: 2px solid #eee; padding-top: 20px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        textarea { width: 100%; height: 120px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-top: 10px; box-sizing: border-box; resize: vertical; }
        
        button { background-color: #ff69b4; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #ff1493; }

        /* Estilo da mensagem de sucesso */
        .thank-you-message { display: none; animation: fadeIn 0.5s; padding: 40px 20px; }
        .thank-you-message h2 { color: #2ecc71; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Logo e Cabeçalho -->
        <div id="evaluation-content">
            <h1>Avaliação Império BR</h1>
            <p>Selecione um membro da equipe para começar sua avaliação:</p>

            <!-- Lista de Funcionários -->
            <div class="team-container">
                <div class="staff-card" onclick="selectStaff(this, 'Atendente 1')">
                    <img src="https://placeholder.com" alt="Funcionário">
                    <p>Atendente 1</p>
                </div>
                <div class="staff-card" onclick="selectStaff(this, 'Atendente 2')">
                    <img src="https://placeholder.com" alt="Funcionário">
                    <p>Atendente 2</p>
                </div>
            </div>

            <!-- Formulário de Feedback -->
            <div class="form-section" id="form-section">
                <h3 id="selected-name">Avaliando: </h3>
                <form id="feedback-form">
                    <label for="comments">Deixe seu comentário ou sugestão:</label>
                    <textarea id="comments" required placeholder="Digite aqui sua opinião..."></textarea>
                    <button type="submit">Enviar Avaliação</button>
                </form>
            </div>
        </div>

        <!-- Tela de Agradecimento (Escondida por padrão) -->
        <div class="thank-you-message" id="thank-you-message">
            <h2>✓ Avaliação Enviada com Sucesso!</h2>
            <p>A equipe da Império BR agradece imensamente o seu feedback. Ele é muito importante para nós!</p>
        </div>
    </div>

    <script>
        // Função para selecionar o funcionário e exibir o formulário
        function selectStaff(element, name) {
            // Remove a seleção visual de outros cartões
            document.querySelectorAll('.staff-card').forEach(card => card.classList.remove('selected'));
            
            // Adiciona a seleção no cartão clicado
            element.classList.add('selected');
            
            // Atualiza o nome no formulário e exibe a seção
            document.getElementById('selected-name').innerText = "Avaliando: " + name;
            document.getElementById('form-section').style.display = 'block';
        }

        // Função que escuta o envio do formulário
        document.getElementById('feedback-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede a página de recarregar
            
            // Oculta o conteúdo da avaliação
            document.getElementById('evaluation-content').style.display = 'none';
            
            // Exibe a mensagem de agradecimento
            document.getElementById('thank-you-message').style.display = 'block';
        });
    </script>
</body>
</html>
